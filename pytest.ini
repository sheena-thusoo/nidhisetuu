[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    live_groq: requires a live GROQ_API_KEY (skipped in mock mode)
    live_pinecone: requires a live PINECONE_API_KEY (skipped in mock mode)
    live_tavily: requires a live TAVILY_API_KEY (skipped in mock mode)
    live_redis: requires a live Redis instance (skipped in mock mode)
